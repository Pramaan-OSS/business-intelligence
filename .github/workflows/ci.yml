name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PRAMAAN_API_KEY: ""
  PRAMAAN_FAKE: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: --no-experimental-webstorage
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/ci-requirements.txt
      - run: python -m pip install -r review/ci-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v4
        with:
          path: .runtime/yarn-cache
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      - run: bash scripts/ci-frontend-setup
      - run: npm exec --yes --package yarn@1.22.22 -- yarn --cwd frontend install --frozen-lockfile --cache-folder ../.runtime/yarn-cache
      - run: ruff check insights
      - run: npm --prefix frontend run lint
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v4
        with:
          path: .runtime/yarn-cache
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      - run: bash scripts/ci-frontend-setup
      - run: npm exec --yes --package yarn@1.22.22 -- yarn --cwd frontend install --frozen-lockfile --cache-folder ../.runtime/yarn-cache
      - run: npm --prefix frontend run typecheck:baseline
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/ci-requirements.txt
      - run: python -m pip install -r review/ci-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v4
        with:
          path: .runtime/yarn-cache
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      - run: bash scripts/ci-frontend-setup
      - run: npm exec --yes --package yarn@1.22.22 -- yarn --cwd frontend install --frozen-lockfile --cache-folder ../.runtime/yarn-cache
      - run: python insights/tests/test_pramaan_client.py
      - run: npm --prefix frontend test
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v4
        with:
          path: .runtime/yarn-cache
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      - run: bash scripts/ci-frontend-setup
      - run: npm exec --yes --package yarn@1.22.22 -- yarn --cwd frontend install --frozen-lockfile --cache-folder ../.runtime/yarn-cache
      - run: npm --prefix frontend run build
      - run: bash scripts/ci-build-islands
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-only
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 60
      cache:
        image: redis:8.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t business-intelligence-ci -f docker/Dockerfile .
      - run: docker run --rm --network "$CI_NETWORK" -e PRAMAAN_API_KEY -e PRAMAAN_FAKE -e DO_NOT_TRACK -e NEXT_TELEMETRY_DISABLED -e BI_SITE_NAME=ci.localhost -e LOCAL_DB_PASSWORD=ci-only -e BI_ADMIN_PASSWORD=ci-only -e BI_ENCRYPTION_KEY=Y2ktb25seS1lbmNyeXB0aW9uLWtleS0wMTIzNDU2Nzg= business-intelligence-ci bash scripts/ci-site-tests
        env:
          CI_NETWORK: ${{ job.services.database.network }}
