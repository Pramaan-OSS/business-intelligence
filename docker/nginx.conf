map $http_origin $bi_socket_origin {
  "" "$scheme://$http_host";
  default $http_origin;
}

server {
  listen 80;
  client_max_body_size 12m;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Only content-named build files are immutable; private files never match.
  location ~ "^/assets/insights/frontend/assets/.+-[a-f0-9]{8}\.(js|css|woff|woff2)$" {
    proxy_pass http://app:8000;
    proxy_set_header Host $http_host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /assets/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $http_host;
    expires 1h;
  }
  location /socket.io/ {
    proxy_pass http://app:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin $bi_socket_origin;
  }
  location / {
    proxy_pass http://app:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
